<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Marketplace image for the Figma handoff extension (1200×896). Screenshot at 1×: see README. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 896px; overflow: hidden; }
  body {
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: radial-gradient(circle at 15% 10%, #ffe1dc 0%, transparent 45%),
      radial-gradient(circle at 90% 95%, #dfe4ff 0%, transparent 50%),
      linear-gradient(135deg, #fff3f0 0%, #f3f1ff 100%);
    position: relative;
  }
  .stage {
    position: absolute; left: 70px; top: 70px; width: 1060px; height: 756px;
    border-radius: 36px; background: rgba(255,255,255,.45);
    border: 1px solid rgba(255,255,255,.85);
    box-shadow: 0 30px 60px rgba(120,40,40,.10);
  }
  .win {
    position: absolute; background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 18px 40px rgba(60,30,60,.18), 0 2px 6px rgba(60,30,60,.08);
  }
  .bar { height: 40px; display: flex; align-items: center; gap: 7px; padding: 0 16px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #fff; opacity: .5; }
  .line { height: 9px; border-radius: 5px; background: #e4e7f2; }

  /* Figma canvas */
  .fig { left: 110px; top: 150px; width: 480px; height: 620px; background: #e9e9e9; }
  .fig .bar { background: #2c2c2c; }
  .fig .tool { width: 22px; height: 22px; border-radius: 5px; background: #444; margin-left: 6px; }
  .fig .tool.on { background: #0d99ff; margin-left: 18px; }
  .flabel { position: absolute; left: 44px; top: 62px; font-size: 13px; color: #0d99ff; font-weight: 600; }
  .frame {
    position: absolute; left: 44px; top: 84px; width: 300px; height: 500px; background: #fff;
    outline: 2px solid #0d99ff; overflow: hidden;
  }
  .handle { position: absolute; width: 9px; height: 9px; background: #fff; border: 2px solid #0d99ff; z-index: 2; }
  .fhero { height: 170px; background: linear-gradient(160deg, #164a5c 0%, #2b6f6a 60%, #e9b8a6 100%); position: relative; padding: 26px 20px; }
  .fhero i { display: block; height: 11px; border-radius: 6px; background: #fff; margin-bottom: 9px; }
  .fhero b { display: inline-block; margin-top: 12px; width: 74px; height: 22px; border-radius: 11px; background: #27b39a; }
  .fhero .house { position: absolute; right: 22px; bottom: 26px; width: 70px; height: 52px; background: #9aa7b7; }
  .fhero .house::before { content: ''; position: absolute; left: -10px; top: -32px; border-left: 45px solid transparent; border-right: 45px solid transparent; border-bottom: 34px solid #6d4a52; }
  .fcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px; }
  .fcards div { height: 108px; border-radius: 8px; background: #f2f4f8; padding: 10px; }
  .fcards div::before { content: ''; display: block; height: 46px; border-radius: 6px; background: #cfe3f0; margin-bottom: 10px; }
  .fcards div::after { content: ''; display: block; height: 7px; width: 70%; border-radius: 4px; background: #c4cad8; }
  .fcta { margin: 4px 20px; height: 110px; border-radius: 10px; background: #0f2a44; padding: 24px 18px; }
  .fcta i { display: block; height: 10px; width: 60%; border-radius: 5px; background: #fff; margin-bottom: 14px; }
  .fcta b { display: block; width: 84px; height: 22px; border-radius: 11px; background: #27b39a; }

  /* plugin window */
  .plug { left: 380px; top: 412px; width: 236px; height: 168px; z-index: 4; border-radius: 12px; }
  .plug .ph { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  .mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #ff5a3c, #eb1000 60%, #c4006a); display: grid; place-items: center; }
  .mark::after { content: ''; width: 0; height: 0; border-left: 9px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 3px; }
  .plug .pt { height: 10px; width: 120px; border-radius: 5px; background: #2c2c2c; }
  .plug .chips { display: flex; gap: 6px; padding: 4px 16px 14px; }
  .plug .chips span { height: 18px; width: 54px; border-radius: 5px; background: #eef0f4; }
  .send { margin: 0 16px; height: 40px; border-radius: 20px; background: #3b63fb; color: #fff; font-size: 15px; font-weight: 700; display: grid; place-items: center; }

  /* connector */
  .go {
    position: absolute; left: 600px; top: 330px; width: 64px; height: 64px; border-radius: 18px;
    background: #fff; display: grid; place-items: center; z-index: 3;
    box-shadow: 0 10px 24px rgba(60,30,60,.18);
  }

  /* EW page + panel */
  .ew { left: 640px; top: 128px; width: 450px; height: 640px; }
  .ew .bar { background: #eb1000; }
  .ewbody { display: grid; grid-template-columns: 1fr 176px; height: 600px; }
  .doc { padding: 22px 20px; border-right: 1.5px solid #eceef4; }
  .h1 { height: 16px; width: 70%; border-radius: 8px; background: #c9cfe6; margin-bottom: 14px; }
  .hero { height: 104px; border-radius: 10px; margin: 6px 0 16px; background: linear-gradient(160deg, #164a5c 0%, #2b6f6a 60%, #e9b8a6 100%); }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .cards div { height: 74px; border-radius: 8px; background: #f2f4f8; }
  .cards div::before { content: ''; display: block; height: 34px; border-radius: 6px 6px 0 0; background: #cfe3f0; }
  .block { border: 2px solid #dfe3f1; border-radius: 9px; margin-bottom: 14px; }
  .block div { height: 26px; border-top: 1.5px solid #eceef6; padding: 9px 12px; }
  .block div:first-child { border-top: 0; background: #eef0fa; }
  .block span { display: block; height: 7px; width: 60%; border-radius: 4px; background: #c9cee4; }
  .panel { padding: 16px 14px; background: #fafafa; }
  .ph2 { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  .ph2 .mark { width: 24px; height: 24px; border-radius: 7px; }
  .ph2 i { height: 9px; width: 80px; border-radius: 5px; background: #2c2c2c; }
  .ring {
    width: 108px; height: 108px; border-radius: 50%; margin: 6px auto 14px;
    background: conic-gradient(#12805c 0 100%); display: grid; place-items: center;
  }
  .ring b { width: 84px; height: 84px; border-radius: 50%; background: #fafafa; display: grid; place-items: center; font-size: 24px; color: #12805c; }
  .bars div { display: flex; align-items: center; gap: 8px; height: 22px; }
  .bars span { height: 6px; border-radius: 3px; background: #12805c; flex: 1; }
  .bars em { height: 6px; width: 34px; border-radius: 3px; background: #d6d9e3; }
  .built {
    margin-top: 18px; height: 36px; border-radius: 18px; background: #12805c; color: #fff;
    font-size: 13px; font-weight: 700; display: grid; place-items: center;
  }
  .ai {
    margin-top: 10px; height: 36px; border-radius: 18px; background: #3b63fb; color: #fff;
    font-size: 13px; font-weight: 700; display: grid; place-items: center;
  }
</style>
</head>
<body>
  <div class="stage"></div>

  <div class="win fig">
    <div class="bar"><span class="tool on"></span><span class="tool"></span><span class="tool"></span><span class="tool"></span></div>
    <div class="flabel">Home loans landing</div>
    <span class="handle" style="left:39px;top:79px"></span><span class="handle" style="left:339px;top:79px"></span>
    <div class="frame">
      <div class="fhero"><i style="width:58%"></i><i style="width:44%"></i><b></b><span class="house"></span></div>
      <div class="fcards"><div></div><div></div><div></div></div>
      <div class="fcta"><i></i><b></b></div>
    </div>
  </div>

  <div class="win plug">
    <div class="ph"><span class="mark"></span><span class="pt"></span></div>
    <div class="chips"><span></span><span></span><span></span></div>
    <div class="send">Send to EW</div>
  </div>

  <div class="go">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#eb1000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </div>

  <div class="win ew">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="ewbody">
      <div class="doc">
        <div class="h1"></div>
        <div class="hero"></div>
        <div class="line" style="width:90%;margin-bottom:8px"></div>
        <div class="line" style="width:70%;margin-bottom:18px"></div>
        <div class="cards"><div></div><div></div><div></div></div>
        <div class="block"><div><span style="width:30%"></span></div><div><span></span></div><div><span style="width:45%"></span></div></div>
        <div class="line" style="width:80%;margin-bottom:8px"></div>
        <div class="line" style="width:56%"></div>
      </div>
      <div class="panel">
        <div class="ph2"><span class="mark"></span><i></i></div>
        <div class="ring"><b>100%</b></div>
        <div class="bars"><div><em></em><span></span></div><div><em></em><span></span></div><div><em></em><span></span></div></div>
        <div class="ai">✦ Build with AI</div>
        <div class="built">✓ Built</div>
      </div>
    </div>
  </div>
</body>
</html>
