<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Marketplace image template (1200×896). Copy to tools/{name}/docs/marketplace.html,
  then render:
    node .github/skills/shipping-ew-extensions/scripts/render-image.mjs \
      --html tools/{name}/docs/marketplace.html --out tools/{name}/marketplace.png
  Style: pastel gradient, stylised windows, grey text bars, 3 to 6 real words, no headline.
  Left = the third party (use its colours, not its logo). Right = the EW panel or page.
  Change --accent, --source-bar and --source-bg first.
-->
<style>
  :root {
    --accent: #3b63fb;          /* your extension's colour */
    --source-bar: #f7f6f3;      /* third-party window title bar */
    --source-bg: #fff;          /* third-party window body */
    --line: #e4e7f2;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 896px; overflow: hidden; }
  body {
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(135deg, #ebe5fc 0%, #e0e6fd 50%, #dcecfb 100%);
    position: relative;
  }
  .stage {
    position: absolute; left: 70px; top: 70px; width: 1060px; height: 756px;
    border-radius: 36px; background: rgb(255 255 255 / 42%);
    border: 1px solid rgb(255 255 255 / 80%);
    box-shadow: 0 30px 60px rgb(60 70 160 / 12%);
  }
  .win {
    position: absolute; background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 18px 40px rgb(40 50 120 / 18%), 0 2px 6px rgb(40 50 120 / 8%);
  }
  .bar { height: 40px; display: flex; align-items: center; gap: 7px; padding: 0 16px; background: #f1f3f9; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #d5d9e6; }
  .body { padding: 24px 28px; display: grid; gap: 14px; }
  .line { height: 10px; border-radius: 5px; background: var(--line); }
  .w90 { width: 90%; } .w75 { width: 75%; } .w60 { width: 60%; } .w40 { width: 40%; }
  .h { height: 18px; width: 70%; border-radius: 6px; background: #c9cee0; }
  .pill {
    display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 14px; font-weight: 600;
    background: color-mix(in srgb, var(--accent) 14%, #fff); color: var(--accent);
  }
  .btn { display: inline-block; padding: 10px 20px; border-radius: 18px; font-size: 16px; font-weight: 600; color: #fff; background: var(--accent); }
  .card { border: 1px solid #e8eaf2; border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
  .img { height: 120px; border-radius: 8px; background: linear-gradient(135deg, #cfd8f6, #e9d9f7); }

  /* Left: the third-party window */
  .source { left: 120px; top: 190px; width: 440px; height: 540px; background: var(--source-bg); }
  .source .bar { background: var(--source-bar); }

  /* Right: the EW page with the extension panel */
  .ew { left: 620px; top: 150px; width: 460px; height: 620px; }
  .ew .split { display: grid; grid-template-columns: 1fr 190px; height: calc(100% - 40px); }
  .ew .doc { padding: 22px; display: grid; gap: 12px; align-content: start; }
  .ew .panel { border-left: 1px solid #eceef5; background: #fafbff; padding: 16px; display: grid; gap: 12px; align-content: start; }

  .arrow {
    position: absolute; left: 540px; top: 430px; width: 110px; height: 44px; z-index: 2;
    display: grid; place-items: center; border-radius: 22px; background: var(--accent); color: #fff;
    font-size: 26px; box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 40%, transparent);
  }
</style>
</head>
<body>
  <div class="stage"></div>

  <div class="win source">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="body">
      <div class="h"></div>
      <div><span class="pill">Ready</span></div>
      <div class="line w90"></div>
      <div class="line w75"></div>
      <div class="img"></div>
      <div class="line w90"></div>
      <div class="line w60"></div>
    </div>
  </div>

  <div class="arrow">→</div>

  <div class="win ew">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="split">
      <div class="doc">
        <div class="h"></div>
        <div class="line w90"></div>
        <div class="line w75"></div>
        <div class="img"></div>
        <div class="line w60"></div>
      </div>
      <div class="panel">
        <div class="card"><div class="line w75"></div><div class="line w40"></div></div>
        <div class="card"><div class="line w90"></div><div class="line w60"></div></div>
        <div><span class="btn">Insert</span></div>
      </div>
    </div>
  </div>
</body>
</html>
