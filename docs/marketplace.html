<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 896px; overflow: hidden; }
  body {
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(135deg, #ebe5fc 0%, #e0e6fd 50%, #dcecfb 100%);
    position: relative;
  }
  .stage {
    position: absolute; left: 70px; top: 70px; width: 1060px; height: 756px;
    border-radius: 36px; background: rgba(255,255,255,.42);
    border: 1px solid rgba(255,255,255,.8);
    box-shadow: 0 30px 60px rgba(60,70,160,.12);
  }
  .win {
    position: absolute; background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 18px 40px rgba(40,50,120,.18), 0 2px 6px rgba(40,50,120,.08);
  }
  .bar { height: 40px; display: flex; align-items: center; gap: 7px; padding: 0 16px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #fff; opacity: .55; }
  .line { height: 10px; border-radius: 6px; background: #e4e7f2; }
  .line.dark { background: #c9cee4; }

  /* editor */
  .editor { left: 115px; top: 165px; width: 560px; height: 520px; }
  .editor .bar { background: #3e4aa6; }
  .editor .bar .title { margin-left: 14px; height: 10px; width: 140px; border-radius: 6px; background: rgba(255,255,255,.35); }
  .doc { position: absolute; left: 0; top: 40px; width: 320px; bottom: 0; padding: 28px 26px; }
  .hero {
    height: 136px; border-radius: 10px; margin-bottom: 22px;
    background: linear-gradient(160deg, #7f97ff 0%, #a98bf5 55%, #f3b6d0 100%); position: relative; overflow: hidden;
  }
  .hero .sun { position: absolute; right: 40px; top: 28px; width: 38px; height: 38px; border-radius: 50%; background: #ffe7a3; }
  .hero .hill { position: absolute; border-radius: 50%; }
  .h1 { height: 18px; width: 82%; border-radius: 8px; background: #b9c0de; margin-bottom: 16px; }
  .doc .line { margin-bottom: 11px; }
  .meta { margin-top: 22px; border: 2px solid #dfe3f1; border-radius: 8px; overflow: hidden; }
  .meta div { display: flex; border-top: 2px solid #dfe3f1; height: 30px; align-items: center; }
  .meta div:first-child { border-top: 0; background: #eef0fa; justify-content: flex-start; padding-left: 10px; }
  .meta span { display: block; height: 8px; border-radius: 5px; background: #cfd5ea; }
  .meta .k { width: 70px; margin: 0 10px; }
  .meta .v { flex: 1; margin-right: 12px; }
  .meta .sep { width: 2px; height: 100%; background: #dfe3f1; border-radius: 0; }

  /* panel */
  .panel {
    position: absolute; right: 0; top: 40px; bottom: 0; width: 240px;
    background: #f8f9fe; border-left: 2px solid #e6e9f5; padding: 22px 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .logo {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, #4f6bff, #8b5cf6);
  }
  .brand b { font-size: 13px; letter-spacing: .08em; color: #3e4aa6; }
  .ring { position: relative; width: 110px; height: 110px; margin: 0 auto 20px; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; color: #12805c; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
  .chip {
    display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 8px;
    border-radius: 12px; background: #fff; border: 1.5px solid #e1e5f3;
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: #2fb67c; }
  .chip span { height: 7px; border-radius: 4px; background: #cdd3e8; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .tick { width: 18px; height: 18px; border-radius: 50%; background: #dff3ea; display: grid; place-items: center; flex: none; }

  /* link card */
  .card { left: 712px; top: 128px; width: 368px; }
  .post-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #4f6bff, #8b5cf6); flex: none; }
  .card .img {
    height: 190px; position: relative; overflow: hidden;
    background: linear-gradient(160deg, #7f97ff 0%, #a98bf5 55%, #f3b6d0 100%);
  }
  .card .sun { position: absolute; right: 60px; top: 36px; width: 54px; height: 54px; border-radius: 50%; background: #ffe7a3; }
  .card .foot { padding: 16px 18px 18px; background: #f3f5fb; }

  /* slack */
  .slack { left: 712px; top: 540px; width: 368px; padding: 18px 20px 20px; }
  .slack .who { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .slack .sq { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(135deg, #4f6bff, #8b5cf6); display: grid; place-items: center; flex: none; }
  .att { border-left: 4px solid #c9cee4; padding-left: 14px; }
  .att .thumb {
    height: 74px; width: 140px; border-radius: 8px; margin: 10px 0 14px;
    background: linear-gradient(160deg, #7f97ff 0%, #a98bf5 55%, #f3b6d0 100%);
  }
  .btns { display: flex; gap: 10px; }
  .btn { height: 30px; border-radius: 7px; padding: 0 14px; display: flex; align-items: center; font-size: 13px; font-weight: 700; }
  .btn.primary { background: #007a5a; color: #fff; }
  .btn.ghost { border: 1.5px solid #cfd3e2; color: #3a3f55; }

  .badge {
    position: absolute; width: 62px; height: 62px; border-radius: 50%; background: #12805c;
    display: grid; place-items: center; box-shadow: 0 10px 24px rgba(18,128,92,.35); border: 4px solid #fff;
  }
  .spark { position: absolute; color: #8b5cf6; }
  .bubble {
    position: absolute; width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center;
    background: #fff; box-shadow: 0 12px 28px rgba(40,50,120,.18);
  }
</style>
</head>
<body>
  <div class="stage"></div>

  <svg style="position:absolute;left:0;top:0" width="1200" height="896">
    <path d="M693 510 C 693 530, 700 545, 712 560" fill="none" stroke="#8b9cf0" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  </svg>

  <!-- editor + ShareReady panel -->
  <div class="win editor">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="title"></span></div>
    <div class="doc">
      <div class="hero">
        <div class="sun"></div>
        <div class="hill" style="left:-40px;top:86px;width:200px;height:110px;background:#5f78e8"></div>
        <div class="hill" style="left:110px;top:98px;width:250px;height:130px;background:#6b6fd8"></div>
      </div>
      <div class="h1"></div>
      <div class="line" style="width:96%"></div>
      <div class="line" style="width:88%"></div>
      <div class="line" style="width:70%"></div>
      <div class="meta">
        <div><span style="width:70px;background:#b9c0de"></span></div>
        <div><span class="k dark"></span><span class="sep"></span><span class="v" style="margin-left:10px;background:#9fb0ff"></span></div>
        <div><span class="k"></span><span class="sep"></span><span class="v" style="margin-left:10px;background:#9fb0ff"></span></div>
        <div><span class="k"></span><span class="sep"></span><span class="v" style="margin-left:10px;max-width:90px;background:#c7b6f6"></span></div>
      </div>
    </div>
    <div class="panel">
      <div class="brand">
        <span class="logo"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M15 5l5 5-5 5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 10h-8a7 7 0 0 0-7 7v2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></span>
        <b>SHAREREADY</b>
      </div>
      <div class="ring">
        <svg width="110" height="110" viewBox="0 0 110 110">
          <circle cx="55" cy="55" r="46" fill="none" stroke="#e3e7f3" stroke-width="11"/>
          <circle cx="55" cy="55" r="46" fill="none" stroke="#2fb67c" stroke-width="11" stroke-linecap="round" stroke-dasharray="289 289" transform="rotate(-90 55 55)"/>
        </svg>
        <b>100</b>
      </div>
      <div class="chips">
        <span class="chip"><i></i><span style="width:34px"></span></span>
        <span class="chip"><i></i><span style="width:44px"></span></span>
        <span class="chip"><i></i><span style="width:28px"></span></span>
        <span class="chip"><i></i><span style="width:40px"></span></span>
        <span class="chip"><i></i><span style="width:20px"></span></span>
        <span class="chip"><i></i><span style="width:36px"></span></span>
        <span class="chip"><i></i><span style="width:30px"></span></span>
        <span class="chip"><i></i><span style="width:26px"></span></span>
      </div>
      <div class="row"><span class="tick"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5.2l2 2 4-4.4" fill="none" stroke="#12805c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="line" style="width:130px"></span></div>
      <div class="row"><span class="tick"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5.2l2 2 4-4.4" fill="none" stroke="#12805c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="line" style="width:110px"></span></div>
      <div class="row"><span class="tick"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5.2l2 2 4-4.4" fill="none" stroke="#12805c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="line" style="width:140px"></span></div>
    </div>
  </div>

  <!-- social link card -->
  <div class="win card">
    <div class="post-head">
      <span class="avatar"></span>
      <div style="flex:1">
        <div class="line dark" style="width:130px;margin-bottom:8px"></div>
        <div class="line" style="width:80px;height:8px"></div>
      </div>
    </div>
    <div style="padding:0 18px 14px"><div class="line" style="width:92%;margin-bottom:8px"></div><div class="line" style="width:60%"></div></div>
    <div class="img">
      <div class="sun"></div>
      <div class="hill" style="position:absolute;border-radius:50%;left:-60px;top:122px;width:260px;height:160px;background:#5f78e8"></div>
      <div class="hill" style="position:absolute;border-radius:50%;left:150px;top:138px;width:300px;height:170px;background:#6b6fd8"></div>
    </div>
    <div class="foot">
      <div class="line" style="width:52px;height:8px;margin-bottom:10px"></div>
      <div class="line dark" style="width:86%;height:13px;margin-bottom:8px;background:#7d86ad"></div>
      <div class="line" style="width:64%"></div>
    </div>
  </div>

  <!-- slack card -->
  <div class="win slack">
    <div class="who">
      <span class="sq"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M15 5l5 5-5 5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 10h-8a7 7 0 0 0-7 7v2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></span>
      <div style="flex:1"><div class="line dark" style="width:110px;margin-bottom:7px"></div><div class="line" style="width:60px;height:8px"></div></div>
    </div>
    <div class="att">
      <div class="line" style="width:78%;height:12px;background:#7d9cf0;margin-bottom:8px"></div>
      <div class="line" style="width:92%;margin-bottom:0"></div>
      <div class="thumb"></div>
      <div class="btns"><span class="btn primary">Open page</span><span class="btn ghost">Edit in EW</span></div>
    </div>
  </div>

  <!-- accents -->
  <div class="badge" style="left:1046px;top:96px">
    <svg width="28" height="28" viewBox="0 0 28 28"><path d="M6 14.5l5.2 5.2L22 8.8" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="bubble" style="left:664px;top:452px">
    <svg width="28" height="28" viewBox="0 0 24 24"><path d="M15 5l5 5-5 5" fill="none" stroke="#3b63fb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 10h-8a7 7 0 0 0-7 7v2" fill="none" stroke="#3b63fb" stroke-width="2.4" stroke-linecap="round"/></svg>
  </div>
  <svg class="spark" style="left:96px;top:110px" width="40" height="40" viewBox="0 0 24 24"><path d="M12 1c.6 5.6 4.4 9.4 11 11-6.6 1.6-10.4 5.4-11 11-.6-5.6-4.4-9.4-11-11 6.6-1.6 10.4-5.4 11-11z" fill="#8b5cf6"/></svg>
  <svg class="spark" style="left:1090px;top:760px" width="26" height="26" viewBox="0 0 24 24"><path d="M12 1c.6 5.6 4.4 9.4 11 11-6.6 1.6-10.4 5.4-11 11-.6-5.6-4.4-9.4-11-11 6.6-1.6 10.4-5.4 11-11z" fill="#6b8bff"/></svg>
</body>
</html>
